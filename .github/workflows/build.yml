name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: sign with your own key. Without these secrets the APK is signed with the Android debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.JOYOUS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JOYOUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JOYOUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JOYOUS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/joyous.jks"
            echo "JOYOUS_KEYSTORE=$RUNNER_TEMP/joyous.jks" >> "$GITHUB_ENV"
            echo "JOYOUS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JOYOUS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "JOYOUS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build debug APKs (normal + testing)
        run: |
          set -o pipefail
          gradle assembleNormalDebug assembleTestingDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish build errors (only on failure)
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan build-log
          git rm -rf -q . || true
          cp "$RUNNER_TEMP/build.log" build.log || echo "no build log" > build.log
          git add build.log
          git commit -q -m "build errors"
          git push -q -f origin build-log

      - name: Publish APK to branch apk
        run: |
          cp app/build/outputs/apk/normal/debug/app-normal-debug.apk "$RUNNER_TEMP/Joyous_remap.apk"
          cp app/build/outputs/apk/testing/debug/app-testing-debug.apk "$RUNNER_TEMP/Joyous_remap_testing.apk"
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan apk
          git rm -rf -q . || true
          cp "$RUNNER_TEMP/Joyous_remap.apk" Joyous_remap.apk
          cp "$RUNNER_TEMP/Joyous_remap_testing.apk" Joyous_remap_testing.apk
          git add Joyous_remap.apk Joyous_remap_testing.apk
          git commit -q -m "apk"
          git push -q -f origin apk

      - uses: actions/upload-artifact@v4
        with:
          name: Joyous-Remap-apk
          path: |
            app/build/outputs/apk/normal/debug/app-normal-debug.apk
            app/build/outputs/apk/testing/debug/app-testing-debug.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/normal/debug/app-normal-debug.apk "$RUNNER_TEMP/Joyous_remap.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/Joyous_remap.apk" \
            --title "Joyous Remap (latest)" \
            --notes "APK built automatically from the main branch."
